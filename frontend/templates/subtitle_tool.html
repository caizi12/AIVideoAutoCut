<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动字幕 - 海映智剪</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        .topbar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: #ffffff;
            border-bottom: 1px solid #e5e9f2;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 18px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: #ffffff;
            background: #2563eb;
            font-size: 16px;
        }

        .back-link {
            color: #3b4a66;
            text-decoration: none;
            font-size: 14px;
            padding: 9px 14px;
            border: 1px solid #d7ddea;
            border-radius: 8px;
            background: #ffffff;
        }

        .workspace {
            width: min(1440px, calc(100vw - 40px));
            margin: 24px auto 40px;
            display: grid;
            grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
            gap: 18px;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #e3e8f3;
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(31, 45, 75, 0.06);
        }

        .panel-header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid #edf1f7;
        }

        .panel-title {
            margin: 0;
            font-size: 18px;
            line-height: 1.3;
        }

        .panel-subtitle {
            margin: 6px 0 0;
            color: #6b7890;
            font-size: 13px;
            line-height: 1.5;
        }

        .panel-body {
            padding: 18px 20px 20px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #2f3a50;
        }

        .field input[type="file"],
        .field select,
        .field input[type="number"],
        .field input[type="text"] {
            width: 100%;
            min-height: 42px;
            border: 1px solid #d7ddea;
            border-radius: 8px;
            background: #ffffff;
            padding: 9px 11px;
            font-size: 14px;
            color: #172033;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-input {
            width: 100%;
            height: 42px;
            padding: 4px;
            border: 1px solid #d7ddea;
            border-radius: 8px;
            background: #ffffff;
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #334155;
            margin: 8px 0 16px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            min-height: 42px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-secondary {
            background: #0f766e;
            color: #ffffff;
        }

        .btn-ghost {
            background: #eef2f8;
            color: #233047;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .status.error {
            background: #fef2f2;
            color: #991b1b;
        }

        .status.success {
            background: #ecfdf5;
            color: #065f46;
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .section-title {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
            color: #1f2a44;
        }

        .mini-btn {
            min-height: 32px;
            padding: 0 10px;
            border: 1px solid #d7ddea;
            border-radius: 7px;
            background: #ffffff;
            color: #334155;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .history-list {
            display: grid;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .history-item {
            width: 100%;
            text-align: left;
            border: 1px solid #e1e7f2;
            border-radius: 8px;
            background: #ffffff;
            padding: 10px 11px;
            cursor: pointer;
        }

        .history-item.active {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .history-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: #172033;
        }

        .history-meta {
            margin-top: 6px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.45;
        }

        .badge {
            flex: none;
            border-radius: 999px;
            padding: 3px 7px;
            background: #e2e8f0;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
        }

        .badge.running,
        .badge.processing {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge.completed {
            background: #dcfce7;
            color: #166534;
        }

        .badge.failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .project-meta {
            display: grid;
            gap: 5px;
            margin-bottom: 16px;
            padding: 10px 12px;
            border: 1px solid #e3e8f3;
            border-radius: 8px;
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
            line-height: 1.45;
        }

        .divider {
            height: 1px;
            margin: 16px 0;
            background: #edf1f7;
        }

        .progress-wrap {
            margin-top: 12px;
            display: grid;
            gap: 8px;
        }

        .progress-track {
            height: 10px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.25s ease;
        }

        .task-info {
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .export-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-actions[hidden] {
            display: none;
        }

        .busy-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: grid;
            place-items: center;
            background: rgba(15, 23, 42, 0.32);
        }

        .busy-overlay[hidden] {
            display: none;
        }

        .busy-box {
            min-width: 260px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 8px;
            background: #ffffff;
            color: #172033;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.2);
            font-size: 14px;
            font-weight: 800;
        }

        .busy-content {
            display: grid;
            gap: 10px;
            min-width: 0;
        }

        .busy-actions {
            display: flex;
            justify-content: flex-end;
        }

        .busy-cancel {
            min-height: 30px;
            padding: 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffff;
            color: #334155;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .busy-cancel[hidden] {
            display: none;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid #dbeafe;
            border-top-color: #2563eb;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .preview-panel {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .video-stage {
            margin: 18px 20px 0;
            background: #0c1220;
            border-radius: 8px;
            min-height: 420px;
            position: relative;
            overflow: hidden;
            display: grid;
            place-items: center;
        }

        .video-stage video {
            width: 100%;
            height: 100%;
            max-height: 620px;
            object-fit: contain;
            display: block;
            background: #0c1220;
        }

        .empty-preview {
            color: #cbd5e1;
            font-size: 15px;
            text-align: center;
            padding: 30px;
        }

        .subtitle-overlay {
            position: absolute;
            left: 50%;
            max-width: min(86%, 920px);
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: 7px;
            line-height: 1.45;
            text-align: center;
            pointer-events: none;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        .subtitle-overlay.bottom {
            bottom: 9%;
        }

        .subtitle-overlay.center {
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .subtitle-overlay.top {
            top: 9%;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px 10px;
        }

        .result-title {
            margin: 0;
            font-size: 16px;
        }

        .subtitle-list {
            margin: 0 20px 20px;
            border: 1px solid #e3e8f3;
            border-radius: 8px;
            overflow: hidden;
            max-height: 360px;
            overflow-y: auto;
            background: #ffffff;
        }

        .subtitle-row {
            display: grid;
            grid-template-columns: 82px 82px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #edf1f7;
        }

        .subtitle-row:last-child {
            border-bottom: 0;
        }

        .time-cell {
            font-variant-numeric: tabular-nums;
            color: #64748b;
            font-size: 12px;
        }

        .subtitle-text {
            width: 100%;
            min-height: 36px;
            border: 1px solid #d7ddea;
            border-radius: 7px;
            padding: 7px 9px;
            font-size: 14px;
            color: #172033;
        }

        .timeline {
            margin: 0 20px 18px;
            height: 42px;
            border-radius: 8px;
            background: #eef2f8;
            position: relative;
            overflow: hidden;
        }

        .timeline-segment {
            position: absolute;
            top: 8px;
            height: 26px;
            border-radius: 6px;
            background: #2563eb;
            opacity: 0.78;
        }

        .broll-workspace {
            margin: 0 20px 22px;
            border-top: 1px solid #edf1f7;
            padding-top: 16px;
        }

        .broll-toolbar {
            display: grid;
            grid-template-columns: repeat(2, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .broll-toolbar select {
            width: 100%;
            min-height: 38px;
            border: 1px solid #d7ddea;
            border-radius: 8px;
            background: #ffffff;
            padding: 7px 9px;
            font-size: 13px;
            color: #172033;
        }

        /* 分段配置面板样式 */
        .broll-template-btn {
            transition: all 0.2s;
        }

        .broll-template-btn:hover {
            background: #f3f4f6 !important;
            border-color: #9ca3af !important;
        }

        .broll-template-btn.active {
            background: #3b82f6 !important;
            color: white !important;
            border-color: #3b82f6 !important;
        }

        #brollConfigBody.expanded {
            display: block !important;
        }

        .broll-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .broll-status {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
            line-height: 1.45;
        }

        .broll-status.error {
            background: #fef2f2;
            color: #991b1b;
        }

        .broll-status.success {
            background: #ecfdf5;
            color: #065f46;
        }

        .broll-shot-list {
            display: grid;
            gap: 10px;
            max-height: 430px;
            overflow-y: auto;
        }

        .broll-shot {
            border: 1px solid #e3e8f3;
            border-radius: 8px;
            background: #ffffff;
            padding: 12px;
        }

        .broll-shot-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: #1f2a44;
            font-size: 13px;
            font-weight: 800;
        }

        .broll-shot-text {
            margin: 8px 0;
            color: #334155;
            font-size: 13px;
            line-height: 1.5;
        }

        .broll-shot-meta {
            margin-bottom: 8px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.45;
        }

        .broll-shot-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
        }

        .broll-shot-controls select {
            width: 100%;
            min-height: 36px;
            border: 1px solid #d7ddea;
            border-radius: 7px;
            background: #ffffff;
            padding: 6px 8px;
            font-size: 12px;
            color: #172033;
        }

        .broll-check {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #475569;
            font-size: 12px;
            white-space: nowrap;
        }

        .broll-links {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .broll-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .workspace {
                grid-template-columns: 1fr;
                width: min(100vw - 24px, 760px);
            }

            .video-stage {
                min-height: 260px;
            }
        }

        @media (max-width: 640px) {
            .topbar {
                padding: 0 14px;
            }

            .grid-2,
            .color-row {
                grid-template-columns: 1fr;
            }

            .subtitle-row {
                grid-template-columns: 70px 70px minmax(0, 1fr);
                gap: 7px;
                padding: 9px;
            }

            .broll-toolbar,
            .broll-shot-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">字</div>
            <span>自动字幕</span>
        </div>
        <a class="back-link" href="/">返回首页</a>
    </header>

    <main class="workspace">
        <section class="panel">
            <div class="panel-header">
                <h1 class="panel-title">上传视频生成字幕</h1>
                <p class="panel-subtitle">选择视频后会自动创建临时项目、登记素材，并调用本地 faster-whisper 生成时间轴字幕。</p>
            </div>
            <div class="panel-body">
                <div class="history-head">
                    <h2 class="section-title">字幕项目记录</h2>
                    <button id="refreshSessionsBtn" class="mini-btn" type="button">刷新</button>
                </div>
                <div id="sessionList" class="history-list"></div>
                <div id="currentProjectMeta" class="project-meta">当前未选择字幕项目。</div>
                <div class="divider"></div>

                <div class="field">
                    <label for="videoFile">视频文件</label>
                    <input id="videoFile" type="file" accept="video/*">
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label for="language">识别语言</label>
                        <select id="language">
                            <option value="zh-CN">中文</option>
                            <option value="en-US">英文</option>
                            <option value="ja-JP">日文</option>
                            <option value="ko-KR">韩文</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="modelSize">识别模型</label>
                        <select id="modelSize">
                            <option value="tiny">tiny（更快）</option>
                            <option value="base">base（均衡）</option>
                            <option value="small">small（更准）</option>
                            <option value="medium">medium（较慢）</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label for="device">运行设备</label>
                        <select id="device">
                            <option value="auto">自动</option>
                            <option value="cpu">CPU</option>
                            <option value="cuda">CUDA</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="position">字幕位置</label>
                        <select id="position">
                            <option value="bottom">底部</option>
                            <option value="center">中间</option>
                            <option value="top">顶部</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label for="fontFamily">字体</label>
                        <select id="fontFamily">
                            <option value="Microsoft YaHei">微软雅黑</option>
                            <option value="PingFang SC">苹方</option>
                            <option value="Source Han Sans SC">思源黑体</option>
                            <option value="SimHei">黑体</option>
                            <option value="Arial">Arial</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="fontSize">字号</label>
                        <input id="fontSize" type="number" min="14" max="72" value="28">
                    </div>
                </div>

                <div class="color-row">
                    <div class="field">
                        <label for="fontColor">文字颜色</label>
                        <input id="fontColor" class="color-input" type="color" value="#ffffff">
                    </div>
                    <div class="field">
                        <label for="bgColor">背景颜色</label>
                        <input id="bgColor" class="color-input" type="color" value="#000000">
                    </div>
                </div>

                <label class="check-row">
                    <input id="boldText" type="checkbox" checked>
                    <span>字幕加粗</span>
                </label>

                <div class="btn-row">
                    <button id="generateBtn" class="btn btn-primary" type="button">生成字幕</button>
                    <button id="applyStyleBtn" class="btn btn-ghost" type="button">应用到全部字幕</button>
                    <button id="downloadSrtBtn" class="btn btn-secondary" type="button" disabled>下载SRT</button>
                    <button id="downloadAssBtn" class="btn btn-secondary" type="button" disabled>下载ASS</button>
                    <button id="renderVideoBtn" class="btn btn-primary" type="button" disabled>导出带字幕视频</button>
                </div>

                <div id="status" class="status">等待选择视频。</div>
                <div class="progress-wrap">
                    <div class="progress-track">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <div id="taskInfo" class="task-info">暂无运行中的任务。</div>
                </div>
                <div id="exportActions" class="export-actions" hidden>
                    <a id="openVideoLink" class="btn btn-ghost" href="#" target="_blank" rel="noopener">打开视频</a>
                    <a id="downloadVideoLink" class="btn btn-secondary" href="#" download>下载视频</a>
                </div>
            </div>
        </section>

        <section class="panel preview-panel">
            <div class="video-stage" id="videoStage">
                <div id="emptyPreview" class="empty-preview">视频预览区</div>
                <video id="videoPreview" controls hidden></video>
                <div id="subtitleOverlay" class="subtitle-overlay bottom" hidden></div>
            </div>

            <div class="result-header">
                <h2 class="result-title">字幕结果</h2>
                <span id="subtitleCount" class="panel-subtitle">0 条字幕</span>
            </div>
            <div id="timeline" class="timeline"></div>
            <div id="subtitleList" class="subtitle-list"></div>

            <div class="result-header">
                <h2 class="result-title">补画面</h2>
                <span id="brollProviderStatus" class="panel-subtitle">素材源未检测</span>
            </div>
            <div class="broll-workspace">
                <div class="broll-toolbar">
                    <label>
                        <span class="panel-subtitle">输出比例</span>
                        <select id="brollAspectRatio">
                            <option value="original">跟随原视频</option>
                            <option value="16:9">16:9 横屏</option>
                        </select>
                    </label>
                    <label>
                        <span class="panel-subtitle">字幕模式</span>
                        <select id="brollSubtitleMode">
                            <option value="burned">默认烧录字幕</option>
                            <option value="none">不烧录字幕</option>
                        </select>
                    </label>
                </div>

                <!-- 分段配置面板 -->
                <div class="broll-config-panel" style="margin: 12px 0; padding: 12px; background: #f8f9fa; border-radius: 6px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span class="panel-subtitle" style="font-weight: 600;">分段配置</span>
                        <button id="brollConfigToggle" type="button" style="padding: 4px 12px; font-size: 12px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">展开配置</button>
                    </div>
                    <div id="brollConfigBody" style="display: none; margin-top: 12px;">
                        <!-- 配置模板 -->
                        <div style="margin-bottom: 12px;">

    <div id="busyOverlay" class="busy-overlay" hidden>
        <div class="busy-box">
            <span class="spinner"></span>
            <div class="busy-content">
                <span id="busyText">正在处理...</span>

                    <button id="busyCancelBtn" class="busy-cancel" type="button" hidden>取消</button>
                </div>

    <script>
        const STORAGE_KEY = 'subtitle_tool_session';

        // 只把 projectId 和 style 存在 localStorage 作为"书签"，数据源是数据库
        function saveSessionRef() {
            const ref = { projectId: state.projectId, style: state.style };
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ref)); } catch (e) { /* ignore */ }
        }

        function loadSessionRef() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) { return null; }
        }

        function clearSessionRef() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
        }

        let activeRestoreSeq = 0;
        let activeRestoreController = null;
        let activeTaskPollToken = 0;

        function isAbortError(error) {
            return error && error.name === 'AbortError';
        }

        // 从数据库 API 恢复完整会话数据
        async function restoreSession(projectId) {
            const restoreSeq = ++activeRestoreSeq;
            const pollToken = ++activeTaskPollToken;
            if (activeRestoreController) {
                activeRestoreController.abort();
            }
            const controller = new AbortController();
            activeRestoreController = controller;
            try {
                setBusy(true, '正在恢复字幕项目...', () => controller.abort());
                const res = await apiJson(
                    `/api/subtitle/session/${encodeURIComponent(projectId)}`,
                    { method: 'GET', signal: controller.signal },
                    20000
                );
                if (restoreSeq !== activeRestoreSeq) return false;
                const data = res.data;
                if (!data) return false;

                applySessionData(data);
                await loadBrollSession(data.project_id || projectId);

                if (state.subtitles.length > 0) {
                    setStatus(`已恢复 ${data.subtitles.length} 条字幕。`, 'success');
                    setProgress(100, `已恢复 ${data.subtitles.length} 条字幕`);
                } else {
                    setStatus('已恢复字幕项目，可继续生成或调整字幕。', 'success');
                    setProgress(0, '项目已恢复');
                }

                // 恢复正在执行的任务
                if (data.current_task_id) {
                    state.currentTaskId = data.current_task_id;
                    state.currentTaskType = data.current_task_type || '';
                    setStatus('检测到后台任务仍在运行，已恢复项目数据，任务进度将在后台同步。', 'success');
                    setProgress(data.current_task_progress || 5, '后台任务同步中，可继续切换项目');
                    resumeTask(data.current_task_id, data.current_task_type || '', data.project_id || projectId, pollToken);
                }

                saveSessionRef();
                return true;
            } catch (e) {
                if (restoreSeq !== activeRestoreSeq) return false;
                if (isAbortError(e)) {
                    setStatus('已取消恢复字幕项目。');
                    setProgress(0, '恢复已取消');
                } else {
                    console.warn('从数据库恢复会话失败', e);
                    setStatus(e.message || '恢复字幕项目失败。', 'error');
                    setProgress(0, e.message || '恢复字幕项目失败');
                }
                return false;
            } finally {
                if (activeRestoreController === controller) {
                    activeRestoreController = null;
                }
                if (restoreSeq === activeRestoreSeq) {
                    setBusy(false);
                }
            }
        }

        // 恢复正在执行的任务
        async function resumeTask(taskId, taskType = '', projectId = state.projectId, pollToken = activeTaskPollToken) {
            const isCurrent = () => pollToken === activeTaskPollToken && state.projectId === projectId;
            try {
                if (!isCurrent()) return;
                const task = await getTask(taskId);
                if (!isCurrent()) return;
                if (!task || task.status === 'completed' || task.status === 'failed' || task.status === 'cancelled') {
                    if (task && task.status === 'completed') {
                        const output = normalizeTaskOutput(task);
                        applyBrollTaskOutput(output);
                        if (Array.isArray(output.subtitles) && output.subtitles.length > 0) {
                            state.subtitles = output.subtitles
                                .filter(item => item && String(item.text || '').trim())
                                .map(item => ({
                                    start: Number(item.start) || 0,
                                    end: Number(item.end) || 0,
                                    text: String(item.text || '').trim()
                                }));
                            renderSubtitles();
                            els.downloadSrtBtn.disabled = false;
                            els.downloadAssBtn.disabled = false;
                            els.renderVideoBtn.disabled = false;
                        }
                        if (output.output_url && !String(taskType || '').startsWith('broll_')) {
                            state.renderedVideoUrl = output.output_url;
                            showExportActions(output.output_url);
                        }
                    }
                    updateProjectMeta();
                    return;
                }
                setStatus('后台任务仍在运行，正在同步进度。', 'success');
                setProgress(task.progress || 5, '后台任务同步中');
                const result = await pollTask(taskId, (t, output) => {
                    if (!isCurrent()) return;
                    applyBrollTaskOutput(output);
                    const subs = Array.isArray(output.subtitles) ? output.subtitles : [];
                    if (subs.length !== state.subtitles.length) {
                        state.subtitles = subs
                            .filter(item => item && String(item.text || '').trim())
                            .map(item => ({
                                start: Number(item.start) || 0,
                                end: Number(item.end) || 0,
                                text: String(item.text || '').trim()
                            }));
                        renderSubtitles();
                    }
                    const msg = output.message || (t.status === 'running' ? '正在识别语音' : t.status);
                    setProgress(t.progress || 0, msg);
                    setStatus(msg, t.status === 'failed' ? 'error' : '');
                }, 2 * 60 * 60 * 1000, isCurrent);
                if (!result || result.cancelled || !isCurrent()) return;
                if (result.task.status === 'completed') {
                    applyBrollTaskOutput(result.output);
                    if (result.output.output_url && !String(taskType || '').startsWith('broll_')) {
                        state.renderedVideoUrl = result.output.output_url;
                        showExportActions(state.renderedVideoUrl);
                        setStatus('带字幕视频导出完成，可打开或下载。', 'success');
                        setProgress(100, '带字幕视频导出完成');
                    } else if (String(taskType || '').startsWith('broll_')) {
                        setBrollStatus('补画面后台任务已完成。', 'success');
                    } else {
                        setStatus(`字幕生成完成，共 ${state.subtitles.length} 条。`, 'success');
                        setProgress(100, `字幕生成完成，共 ${state.subtitles.length} 条`);
                    }
                    els.downloadSrtBtn.disabled = state.subtitles.length === 0;
                    els.downloadAssBtn.disabled = state.subtitles.length === 0;
                    els.renderVideoBtn.disabled = state.subtitles.length === 0;
                    await saveSessionSnapshot(true);
                    await loadSessions(false);
                }
            } catch (err) {
                console.warn('恢复任务失败', err);
            }
        }

        const state = {
            projectId: '',
            projectName: '',
            sessions: [],
            videoFile: null,
            videoUrl: '',
            serverVideoPath: '',
            videoName: '',
            renderedVideoUrl: '',
            currentTaskId: '',

            renderTaskId: '',
            subtitles: [],
            brollSession: null,
            brollProviders: [],

            applyStyleBtn: document.getElementById('applyStyleBtn'),
            downloadSrtBtn: document.getElementById('downloadSrtBtn'),
            downloadAssBtn: document.getElementById('downloadAssBtn'),
            renderVideoBtn: document.getElementById('renderVideoBtn'),
            status: document.getElementById('status'),
            progressBar: document.getElementById('progressBar'),

            downloadVideoLink: document.getElementById('downloadVideoLink'),
            emptyPreview: document.getElementById('emptyPreview'),

            subtitleOverlay: document.getElementById('subtitleOverlay'),
            subtitleList: document.getElementById('subtitleList'),
            subtitleCount: document.getElementById('subtitleCount'),
            timeline: document.getElementById('timeline'),
            brollProviderStatus: document.getElementById('brollProviderStatus'),
            brollAspectRatio: document.getElementById('brollAspectRatio'),
            brollSubtitleMode: document.getElementById('brollSubtitleMode'),
            brollPlanBtn: document.getElementById('brollPlanBtn'),
            brollSearchBtn: document.getElementById('brollSearchBtn'),
            brollDownloadBtn: document.getElementById('brollDownloadBtn'),
            brollComposeBtn: document.getElementById('brollComposeBtn'),
            brollStatus: document.getElementById('brollStatus'),
            brollShotList: document.getElementById('brollShotList'),
            brollExportActions: document.getElementById('brollExportActions'),
            openBrollVideoLink: document.getElementById('openBrollVideoLink'),
            downloadBrollVideoLink: document.getElementById('downloadBrollVideoLink'),
            brollManifestLink: document.getElementById('brollManifestLink'),
            // 分段配置元素
            brollConfigToggle: document.getElementById('brollConfigToggle'),

            brollResetConfig: document.getElementById('brollResetConfig')
        };

        function setStatus(message, type = '') {
            els.status.textContent = message;
            els.status.className = type ? `status ${type}` : 'status';
        }

        function setBrollStatus(message, type = '') {
            els.brollStatus.textContent = message;
            els.brollStatus.className = type ? `broll-status ${type}` : 'broll-status';
        }

        function setBusy(active, message = '正在处理...', onCancel = null) {
            els.busyText.textContent = message;
            els.busyOverlay.hidden = !active;
            els.busyCancelBtn.hidden = !(active && typeof onCancel === 'function');
            els.busyCancelBtn.onclick = active && typeof onCancel === 'function' ? onCancel : null;
        }

        function setProgress(progress, message = '') {
            const value = Math.max(0, Math.min(100, Number(progress) || 0));
            els.progressBar.style.width = `${value}%`;
            els.taskInfo.textContent = message ? `${value}% · ${message}` : `${value}%`;
        }

        function hideExportActions() {
            els.exportActions.hidden = true;
            els.openVideoLink.href = '#';
            els.downloadVideoLink.href = '#';
        }

        function showExportActions(videoUrl) {
            if (!videoUrl) {
                hideExportActions();
                return;
            }
            els.openVideoLink.href = videoUrl;
            els.downloadVideoLink.href = videoUrl;
            els.exportActions.hidden = false;
        }

        function hideBrollExportActions() {
            els.brollExportActions.hidden = true;
            els.openBrollVideoLink.href = '#';
            els.downloadBrollVideoLink.href = '#';
            els.brollManifestLink.href = '#';
        }

        function showBrollExportActions(session) {
            const videoUrl = session && session.rendered_video_url;
            const manifestUrl = session && session.license_manifest_url;
            if (!videoUrl && !manifestUrl) {
                hideBrollExportActions();
                return;
            }
            els.openBrollVideoLink.href = videoUrl || '#';
            els.downloadBrollVideoLink.href = videoUrl || '#';
            els.brollManifestLink.href = manifestUrl || '#';
            els.openBrollVideoLink.hidden = !videoUrl;
            els.downloadBrollVideoLink.hidden = !videoUrl;
            els.brollManifestLink.hidden = !manifestUrl;
            els.brollExportActions.hidden = false;
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function readStyle() {
            const selectedFont = els.fontFamily.selectedOptions && els.fontFamily.selectedOptions[0];
            state.style = {
                position: els.position.value,
                fontFamily: (selectedFont && (selectedFont.dataset.family || selectedFont.textContent.trim())) || els.fontFamily.value,
                fontFile: (selectedFont && selectedFont.dataset.fontFile) || '',
                fontSize: Math.max(14, Math.min(72, Number(els.fontSize.value) || 28)),
                fontColor: els.fontColor.value,
                bgColor: els.bgColor.value,
                bold: els.boldText.checked
            };
            applyOverlayStyle();
            if (state.subtitles.length > 0) saveSessionRef();
        }

        function applyOverlayStyle() {
            const s = state.style;
            els.subtitleOverlay.className = `subtitle-overlay ${s.position}`;
            els.subtitleOverlay.style.fontFamily = s.fontFamily;
            els.subtitleOverlay.style.fontSize = `${s.fontSize}px`;
            els.subtitleOverlay.style.color = s.fontColor;
            els.subtitleOverlay.style.background = hexToRgba(s.bgColor, 0.78);
            els.subtitleOverlay.style.fontWeight = s.bold ? '800' : '500';
        }

        function hexToRgba(hex, alpha) {
            const value = String(hex || '#000000').replace('#', '');
            const full = value.length === 3 ? value.split('').map(ch => ch + ch).join('') : value;
            const r = parseInt(full.slice(0, 2), 16) || 0;
            const g = parseInt(full.slice(2, 4), 16) || 0;
            const b = parseInt(full.slice(4, 6), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function normalizePath(path) {
            const text = String(path || '').replace(/\\/g, '/');
            return text.startsWith('/') ? text : `/${text}`;
        }

        async function apiJson(url, options = {}, timeoutMs = 60000) {
            const requestOptions = {...options};
            const externalSignal = requestOptions.signal;
            const controller = new AbortController();
            let didTimeout = false;
            let timeoutId = null;
            let abortExternal = null;

            if (externalSignal) {
                if (externalSignal.aborted) {
                    controller.abort();
                } else {
                    abortExternal = () => controller.abort();
                    externalSignal.addEventListener('abort', abortExternal, {once: true});
                }
            }
            if (timeoutMs > 0) {
                timeoutId = setTimeout(() => {
                    didTimeout = true;
                    controller.abort();
                }, timeoutMs);
            }
            requestOptions.signal = controller.signal;

            try {
                const response = await fetch(url, requestOptions);
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.code !== 0) {
                    throw new Error(data.msg || `请求失败：${response.status}`);
                }
                return data;
            } catch (error) {
                if (error && error.name === 'AbortError') {
                    const message = didTimeout ? '请求超时，请稍后重试。' : '请求已取消。';
                    const abortError = new Error(message);
                    abortError.name = didTimeout ? 'TimeoutError' : 'AbortError';
                    throw abortError;
                }
                throw error;
            } finally {
                if (timeoutId) clearTimeout(timeoutId);
                if (externalSignal && abortExternal) {
                    externalSignal.removeEventListener('abort', abortExternal);
                }
            }
        }

        function statusLabel(status) {
            const map = {
                draft: '草稿',
                processing: '处理中',
                pending: '等待中',
                running: '运行中',
                completed: '已完成',
                failed: '失败',
                cancelled: '已取消'
            };
            return map[status] || status || '草稿';
        }

        function formatDateTime(value) {
            if (!value) return '未知时间';
            const normalized = String(value).replace(' ', 'T');
            const date = new Date(normalized);
            if (Number.isNaN(date.getTime())) return String(value);
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const mi = String(date.getMinutes()).padStart(2, '0');
            return `${mm}-${dd} ${hh}:${mi}`;
        }

        function updateProjectMeta() {
            if (!state.projectId) {
                els.currentProjectMeta.textContent = '当前未选择字幕项目。';
                return;
            }
            const subtitleInfo = `${state.subtitles.length} 条字幕`;
            const videoInfo = state.videoName || state.serverVideoPath || '未登记视频';
            els.currentProjectMeta.innerHTML = `
                <strong>${escapeHtml(state.projectName || '自动字幕项目')}</strong>
                <span>视频：${escapeHtml(videoInfo)}</span>
                <span>项目ID：${escapeHtml(state.projectId)}</span>
                <span>状态：${escapeHtml(subtitleInfo)}${state.currentTaskId ? `，任务 ${escapeHtml(state.currentTaskId)}` : ''}</span>
            `;
        }

        function renderSessionList() {
            els.sessionList.innerHTML = '';
            if (!state.sessions.length) {
                els.sessionList.innerHTML = '<div class="project-meta">暂无字幕项目记录。选择视频后会自动创建记录。</div>';
                return;
            }
            state.sessions.forEach(item => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `history-item${item.project_id === state.projectId ? ' active' : ''}`;
                button.dataset.projectId = item.project_id;
                const status = item.current_task_id ? 'running' : (item.status || 'draft');
                const progress = item.current_task_id ? ` · ${Math.round(Number(item.current_task_progress) || 0)}%` : '';
                button.innerHTML = `
                    <div class="history-title">
                        <span>${escapeHtml(item.name || '自动字幕项目')}</span>
                        <span class="badge ${escapeHtml(status)}">${escapeHtml(statusLabel(status))}${progress}</span>
                    </div>
                    <div class="history-meta">
                        ${escapeHtml(item.video_name || '未命名视频')}<br>
                        ${Number(item.subtitle_count) || 0} 条字幕 · ${Number(item.task_count) || 0} 个任务 · ${formatDateTime(item.updated_at || item.created_at)}
                    </div>
                `;
                els.sessionList.appendChild(button);
            });
        }

        async function loadSessions(selectLatest = false) {
            try {
                const res = await apiJson('/api/subtitle/sessions?limit=50', {method: 'GET'});
                state.sessions = (res.data && res.data.sessions) || [];
                renderSessionList();
                if (selectLatest && !state.projectId && state.sessions.length) {
                    await restoreSession(state.sessions[0].project_id);
                }
            } catch (error) {

        // 分段配置模板
        const brollConfigTemplates = {

                prefer_sentence_boundary: false
            },
            fast: {

            },
            slow: {

            },

            },

        // 获取当前配置
        function getBrollConfig() {
            return {
                min_shot_duration: parseFloat(els.brollMinDuration?.value) || 3.0,

                prefer_sentence_boundary: els.brollPreferSentence?.checked || false
            };

        // 检测当前配置属于哪个模板
        function detectCustomConfig() {
            if (!els.brollMinDuration || !els.brollMaxDuration || !els.brollPreferSentence) {
                return 'default';
            }

            const current = getBrollConfig();

            for (const [key, template] of Object.entries(brollConfigTemplates)) {
                if (Math.abs(current.min_shot_duration - template.min_shot_duration) < 0.1 &&
                    Math.abs(current.max_shot_duration - template.max_shot_duration) < 0.1 &&
                    current.prefer_sentence_boundary === template.prefer_sentence_boundary) {
                    return key;
                }
            }

            return 'custom';
        }

            els.brollMinDuration.value = template.min_shot_duration;
            els.brollMaxDuration.value = template.max_shot_duration;
            els.brollPreferSentence.checked = template.prefer_sentence_boundary;

        function renderBrollWorkspace() {
            const session = state.brollSession || defaultBrollSession();
            const shots = Array.isArray(session.shots) ? session.shots : [];
            const hasSubtitles = state.subtitles.length > 0;
            const hasCandidates = shots.some(shot => Array.isArray(shot.candidates) && shot.candidates.length);
            const hasDownloads = shots.some(shot => (shot.candidates || []).some(candidate => candidate.local_path));

            els.brollPlanBtn.disabled = !state.projectId || !hasSubtitles;
            els.brollSearchBtn.disabled = !state.projectId || shots.length === 0;
            els.brollDownloadBtn.disabled = !state.projectId || !hasCandidates;
            els.brollComposeBtn.disabled = !state.projectId || shots.length === 0;
            if (shots.length === 0) {
                els.brollShotList.innerHTML = '<div class="broll-status">暂无补画面方案。生成字幕后点击“生成补画面方案”。</div>';
                setBrollStatus(hasSubtitles ? '可以生成补画面方案。' : '生成字幕后可创建补画面方案。');
                hideBrollExportActions();
                return;
            }

            setBrollStatus(`已生成 ${shots.length} 个镜头${hasCandidates ? '，可下载选中素材或继续替换候选。' : '，下一步搜索素材候选。'}`, hasDownloads ? 'success' : '');
            els.brollShotList.innerHTML = '';
            shots.forEach((shot, index) => {
                const candidates = Array.isArray(shot.candidates) ? shot.candidates : [];
                const selectedId = shot.selected_candidate_id || (candidates[0] && candidates[0].candidate_id) || '';
                const selected = candidates.find(item => item.candidate_id === selectedId) || candidates[0] || null;
                const row = document.createElement('div');
                row.className = 'broll-shot';
                row.innerHTML = `
                    <div class="broll-shot-head">
                        <span>${escapeHtml(shot.shot_id || `s${index + 1}`)} · ${formatClock(shot.start)}-${formatClock(shot.end)}</span>
                        <span>${Number(shot.duration || 0).toFixed(1)}s</span>
                    </div>
                    <div class="broll-shot-text">${escapeHtml(shot.subtitle_text || '')}</div>
                    <div class="broll-shot-meta">关键词：${escapeHtml((shot.keywords || []).join('、') || '未生成')} · 候选：${candidates.length}</div>
                    <div class="broll-shot-controls">
                        <select class="broll-candidate-select" data-index="${index}" ${candidates.length ? '' : 'disabled'}>
                            ${candidates.length ? candidates.map(candidate => `
                                <option value="${escapeHtml(candidate.candidate_id)}" ${candidate.candidate_id === selectedId ? 'selected' : ''}>
                                    ${escapeHtml(candidate.provider)} · ${escapeHtml(candidate.author || '未知作者')} · ${candidate.width || 0}x${candidate.height || 0} · 评分 ${candidate.score || 0}${candidate.local_path ? ' · 已下载' : ''}
                                </option>
                            `).join('') : '<option value="">暂无候选</option>'}
                        </select>
                        <label class="broll-check"><input class="broll-lock" data-index="${index}" type="checkbox" ${shot.locked ? 'checked' : ''}>锁定</label>
                        <label class="broll-check"><input class="broll-skip" data-index="${index}" type="checkbox" ${shot.skipped ? 'checked' : ''}>跳过</label>
                    </div>
                    <div class="broll-links">
                        ${selected && selected.source_url ? `<a href="${escapeHtml(selected.source_url)}" target="_blank" rel="noopener">素材原页</a>` : ''}
                        ${selected && selected.license_url ? `<a href="${escapeHtml(selected.license_url)}" target="_blank" rel="noopener">许可说明</a>` : ''}
                        ${selected && selected.local_path ? `<span>本地：${escapeHtml(selected.local_path)}</span>` : ''}
                    </div>
                `;
                els.brollShotList.appendChild(row);
            });
            showBrollExportActions(session);
        }

        async function createBrollTask(url) {
            // 获取当前配置
            const config = getBrollConfig();

            const res = await apiJson(url, {

        async function getTask(taskId) {
            const res = await apiJson(`/api/tasks/${encodeURIComponent(taskId)}`, {method: 'GET'});
            return res.data || {};
        }

        function normalizeTaskOutput(task) {
            const output = task.output_data || {};
            return typeof output === 'string' ? safeJson(output) : output;
        }

        function safeJson(text) {
            try {
                return JSON.parse(text || '{}');
            } catch (error) {
                return {};
            }
        }

        async function pollTask(taskId, onUpdate, maxMs = 2 * 60 * 60 * 1000, shouldContinue = () => true) {
            let done = false;
            const startedAt = Date.now();
            while (!done) {
                if (!shouldContinue()) {
                    return {cancelled: true};
                }
                const elapsed = Date.now() - startedAt;
                if (elapsed > maxMs) {
                    throw new Error('字幕识别超时（已等待2小时仍未完成），请尝试使用更小的模型或更短的视频。后台任务可能仍在运行，您可以在历史任务中查看状态。');
                }
                const task = await getTask(taskId);
                const output = normalizeTaskOutput(task);
                if (!shouldContinue()) {
                    return {cancelled: true};
                }
                onUpdate(task, output);
                if (task.status === 'completed' || task.status === 'failed' || task.status === 'cancelled') {
                    done = true;
                    return {task, output};
                }
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
        }

        function applyBrollTaskOutput(output) {
            if (!output || typeof output !== 'object') return;
            if (output.broll_session) {
                state.brollSession = output.broll_session;
                applyBrollControls();
                renderBrollWorkspace();
            }
            if (output.output_url) {
                state.brollSession = state.brollSession || defaultBrollSession();
                state.brollSession.rendered_video_url = output.output_url;
                if (output.license_manifest_url) {
                    state.brollSession.license_manifest_url = output.license_manifest_url;
                }
                showBrollExportActions(state.brollSession);
                els.videoPreview.src = output.output_url;
                els.videoPreview.hidden = false;
                els.emptyPreview.hidden = true;
            }
        }

        async function runBrollTask(url, taskType, startedMessage, completedMessage) {
            activeTaskPollToken++;
            if (!state.projectId) {
                setBrollStatus('请先选择或恢复字幕项目。', 'error');
                return;
            }
            if (!state.subtitles.length) {
                setBrollStatus('请先生成字幕，再使用补画面功能。', 'error');
                return;
            }
            readStyle();
            state.brollSession = state.brollSession || defaultBrollSession();
            state.brollSession.aspect_ratio = els.brollAspectRatio.value;
            state.brollSession.subtitle_mode = els.brollSubtitleMode.value;
            setBrollStatus(startedMessage);
            setProgress(0, startedMessage);
            try {
                await saveSessionSnapshot(true);
                await saveBrollSessionSnapshot(true);
                const taskId = await createBrollTask(url);
                state.currentTaskId = taskId;
                state.currentTaskType = taskType;
                updateProjectMeta();
                const result = await pollTask(taskId, (task, output) => {
                    applyBrollTaskOutput(output);
                    const msg = output.message || (task.status === 'running' ? startedMessage : task.status);
                    setProgress(task.progress || 0, msg);
                    setBrollStatus(msg, task.status === 'failed' ? 'error' : '');
                }, 2 * 60 * 60 * 1000);
                if (result.task.status === 'failed') {
                    throw new Error(result.task.error_message || result.output.message || `${startedMessage}失败`);
                }
                applyBrollTaskOutput(result.output);
                setBrollStatus(completedMessage, 'success');
                setProgress(100, completedMessage);
                await saveBrollSessionSnapshot(true);
                await loadSessions(false);
            } catch (error) {
                setBrollStatus(error.message || `${startedMessage}失败。`, 'error');
                setProgress(0, error.message || `${startedMessage}失败`);
            } finally {
                state.currentTaskId = '';
                state.currentTaskType = '';
                updateProjectMeta();
                renderBrollWorkspace();
            }
        }

        async function handleGenerate() {
            activeTaskPollToken++;
            if (!state.projectId && !state.videoFile) {
                setStatus('请先选择一个视频文件，或从左侧记录恢复一个项目。', 'error');
                return;
            }

            readStyle();
            els.generateBtn.disabled = true;
            els.downloadSrtBtn.disabled = true;
            els.downloadAssBtn.disabled = true;
            els.renderVideoBtn.disabled = true;
            hideExportActions();
            state.renderedVideoUrl = '';
            state.currentTaskId = '';
            state.subtitles = [];
            renderSubtitles();
            setProgress(0, '准备开始');

            try {
                if (!state.projectId || !state.serverVideoPath) {
                    if (!state.videoFile) {
                        throw new Error('当前项目没有可用视频，请重新选择视频。');
                    }
                    await persistSelectedVideo(state.videoFile, false);
                }
                const projectId = state.projectId;

                setStatus('已创建字幕识别任务，正在后台识别...');
                const taskId = await createSubtitleGenerateTask(projectId);
                state.currentTaskId = taskId;
                state.currentTaskType = 'subtitle_generate';
                setProgress(1, `任务已创建：${taskId}`);
                await saveSessionSnapshot(true);

                const result = await pollTask(taskId, (task, output) => {
                    const subtitles = Array.isArray(output.subtitles) ? output.subtitles : [];
                    if (subtitles.length !== state.subtitles.length) {
                        state.subtitles = subtitles
                            .filter(item => item && String(item.text || '').trim())
                            .map(item => ({
                                start: Number(item.start) || 0,
                                end: Number(item.end) || 0,
                                text: String(item.text || '').trim()
                            }));
                        renderSubtitles();
                        saveSessionRef();
                        saveSessionSnapshot(false);
                    }
                    const msg = output.message || (task.status === 'running' ? '正在识别语音' : task.status);
                    setProgress(task.progress || 0, msg);
                    setStatus(msg, task.status === 'failed' ? 'error' : '');
                });

                if (result.task.status === 'failed') {
                    throw new Error(result.task.error_message || result.output.message || '字幕生成失败');
                }

                setStatus(`字幕生成完成，共 ${state.subtitles.length} 条。`, 'success');
                setProgress(100, `字幕生成完成，共 ${state.subtitles.length} 条`);
                els.downloadSrtBtn.disabled = state.subtitles.length === 0;
                els.downloadAssBtn.disabled = state.subtitles.length === 0;
                els.renderVideoBtn.disabled = state.subtitles.length === 0;
                await saveSessionSnapshot(true);
                await loadSessions(false);
            } catch (error) {
                setStatus(error.message || '字幕生成失败。', 'error');
                setProgress(0, error.message || '字幕生成失败');
            } finally {
                els.generateBtn.disabled = false;
            }
        }

        async function renderSubtitleVideo() {
            activeTaskPollToken++;
            if (!state.subtitles.length) {
                setStatus('请先生成字幕。', 'error');
                return;
            }
            if (!state.projectId && !state.serverVideoPath) {
                setStatus('未找到服务端视频文件，请重新上传并生成字幕。', 'error');
                return;
            }

            readStyle();
            els.renderVideoBtn.disabled = true;
            hideExportActions();
            setStatus('正在创建带字幕视频导出任务...');
            setProgress(0, '准备导出视频');

            try {
                await saveSessionSnapshot(true);
                const taskId = await createRenderVideoTask();
                state.renderTaskId = taskId;
                state.currentTaskId = taskId;
                state.currentTaskType = 'subtitle_render_video';
                const result = await pollTask(taskId, (task, output) => {
                    const msg = output.message || (task.status === 'running' ? '正在导出带字幕视频' : task.status);
                    setProgress(task.progress || 0, msg);
                    setStatus(msg, task.status === 'failed' ? 'error' : '');
                });

                if (result.task.status === 'failed') {
                    throw new Error(result.task.error_message || result.output.message || '导出带字幕视频失败');
                }

                state.renderedVideoUrl = result.output.output_url || '';
                saveSessionRef();
                await saveSessionSnapshot(true);
                await loadSessions(false);
                if (state.renderedVideoUrl) {
                    els.videoPreview.src = state.renderedVideoUrl;
                    els.videoPreview.hidden = false;
                    els.emptyPreview.hidden = true;
                    showExportActions(state.renderedVideoUrl);
                    setStatus(`带字幕视频导出完成：${state.renderedVideoUrl}`, 'success');
                    setProgress(100, '带字幕视频导出完成，可打开或下载');
                } else {
                    setStatus('带字幕视频导出完成，但后端未返回文件地址。', 'success');
                    setProgress(100, '带字幕视频导出完成');
                }
            } catch (error) {
                setStatus(error.message || '导出带字幕视频失败。', 'error');
                setProgress(0, error.message || '导出带字幕视频失败');
            } finally {
                els.renderVideoBtn.disabled = state.subtitles.length === 0;
            }
        }

        function renderSubtitles() {
            els.subtitleCount.textContent = `${state.subtitles.length} 条字幕`;
            els.subtitleList.innerHTML = '';
            els.timeline.innerHTML = '';

            if (!state.subtitles.length) {
                els.subtitleList.innerHTML = '<div class="subtitle-row"><span class="time-cell">--:--</span><span class="time-cell">--:--</span><input class="subtitle-text" value="等待生成字幕" disabled></div>';
                updateActiveSubtitle();
                updateProjectMeta();
                renderBrollWorkspace();
                return;
            }

            const totalEnd = Math.max(...state.subtitles.map(item => item.end || 0), 1);
            state.subtitles.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'subtitle-row';
                row.innerHTML = `
                    <span class="time-cell">${formatClock(item.start)}</span>
                    <span class="time-cell">${formatClock(item.end)}</span>
                    <input class="subtitle-text" data-index="${index}" value="${escapeHtml(item.text)}">
                `;
                els.subtitleList.appendChild(row);

                const segment = document.createElement('div');
                segment.className = 'timeline-segment';
                segment.style.left = `${Math.max(0, item.start / totalEnd * 100)}%`;
                segment.style.width = `${Math.max(0.4, (item.end - item.start) / totalEnd * 100)}%`;
                els.timeline.appendChild(segment);
            });
            updateActiveSubtitle();
            updateProjectMeta();
            renderBrollWorkspace();
        }

        function updateActiveSubtitle() {
            const current = els.videoPreview.currentTime || 0;
            const active = state.subtitles.find(item => current >= item.start && current <= item.end);
            if (!active) {
                els.subtitleOverlay.hidden = true;
                els.subtitleOverlay.textContent = '';
                return;
            }
            els.subtitleOverlay.hidden = false;
            els.subtitleOverlay.textContent = active.text;
            applyOverlayStyle();
        }

        function formatClock(seconds) {
            const total = Math.max(0, Number(seconds) || 0);
            const mins = Math.floor(total / 60);
            const secs = Math.floor(total % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function formatSrtTime(seconds) {
            const total = Math.max(0, Number(seconds) || 0);
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const secs = Math.floor(total % 60);
            const millis = Math.round((total - Math.floor(total)) * 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')},${String(millis).padStart(3, '0')}`;
        }

        function downloadText(filename, content, mime = 'text/plain;charset=utf-8') {
            const blob = new Blob([content], {type: mime});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function buildSrt() {
            return state.subtitles.map((item, index) => [
                String(index + 1),
                `${formatSrtTime(item.start)} --> ${formatSrtTime(item.end)}`,
                item.text,
                ''
            ].join('\n')).join('\n');
        }

        function buildAss() {
            const s = state.style;
            const alignmentMap = {bottom: 2, center: 5, top: 8};
            const primary = hexToAssColor(s.fontColor);
            const outline = hexToAssColor(s.bgColor);
            const bold = s.bold ? -1 : 0;
            const lines = [
                '[Script Info]',
                'ScriptType: v4.00+',
                'PlayResX: 1920',
                'PlayResY: 1080',
                '',
                '[V4+ Styles]',
                'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
                `Style: Default,${s.fontFamily},${s.fontSize},${primary},${primary},${outline},&H80000000,${bold},0,0,0,100,100,0,0,1,3,0,${alignmentMap[s.position] || 2},80,80,70,1`,
                '',
                '[Events]',
                'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text'
            ];
            state.subtitles.forEach(item => {
                lines.push(`Dialogue: 0,${formatAssTime(item.start)},${formatAssTime(item.end)},Default,,0,0,0,,${escapeAssText(item.text)}`);
            });
            return lines.join('\n');
        }

        function hexToAssColor(hex) {
            const value = String(hex || '#ffffff').replace('#', '').padEnd(6, '0');
            const r = value.slice(0, 2);
            const g = value.slice(2, 4);
            const b = value.slice(4, 6);
            return `&H00${b}${g}${r}`;
        }

        function formatAssTime(seconds) {
            const total = Math.max(0, Number(seconds) || 0);
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const secs = Math.floor(total % 60);
            const centis = Math.floor((total - Math.floor(total)) * 100);
            return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(centis).padStart(2, '0')}`;
        }

        function escapeAssText(text) {
            return String(text || '')
                .replace(/\{/g, '(')
                .replace(/\}/g, ')')
                .replace(/\r?\n/g, '\\N');
        }

        els.videoFile.addEventListener('change', async () => {
            activeTaskPollToken++;
            const file = els.videoFile.files && els.videoFile.files[0];
            state.videoFile = file || null;
            state.projectId = '';
            state.projectName = '';
            state.serverVideoPath = '';
            state.videoName = file ? file.name : '';
            state.renderedVideoUrl = '';
            state.currentTaskId = '';
            state.currentTaskType = '';
            state.renderTaskId = '';
            state.subtitles = [];
            state.brollSession = defaultBrollSession();
            renderSubtitles();
            els.downloadSrtBtn.disabled = true;
            els.downloadAssBtn.disabled = true;
            els.renderVideoBtn.disabled = true;
            hideExportActions();
            hideBrollExportActions();
            setProgress(0, '暂无运行中的任务。');

            if (state.videoUrl) {
                URL.revokeObjectURL(state.videoUrl);
                state.videoUrl = '';
            }

            if (!file) {
                els.videoPreview.hidden = true;
                els.emptyPreview.hidden = false;
                setStatus('等待选择视频。');
                return;
            }

            state.videoUrl = URL.createObjectURL(file);
            els.videoPreview.src = state.videoUrl;
            els.videoPreview.hidden = false;
            els.emptyPreview.hidden = true;
            setStatus(`已选择：${file.name}，正在上传保存记录...`);
            try {
                await persistSelectedVideo(file);
            } catch (error) {
                setStatus(error.message || '视频上传保存失败。', 'error');
                setProgress(0, error.message || '视频上传保存失败');
            }
        });

        // 配置面板事件监听器（添加安全检查）
        if (els.brollConfigToggle && els.brollConfigBody) {
            els.brollConfigToggle.addEventListener('click', () => {
                const isExpanded = els.brollConfigBody.classList.toggle('expanded');
                els.brollConfigToggle.textContent = isExpanded ? '收起配置' : '展开配置';
            });
        }

        // 模板按钮事件
        document.querySelectorAll('.broll-template-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                applyBrollTemplate(btn.dataset.template);
                saveBrollSessionSnapshot(false);  // 自动保存配置
            });
        });

        // 配置输入变化时自动保存
        if (els.brollMinDuration && els.brollMaxDuration && els.brollPreferSentence) {
            [els.brollMinDuration, els.brollMaxDuration, els.brollPreferSentence].forEach(el => {
                el.addEventListener('change', () => {
                    const detected = detectCustomConfig();
                    document.querySelectorAll('.broll-template-btn').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.template === detected);
                    });
                    saveBrollSessionSnapshot(false);  // 自动保存配置
                });
            });
        }

        // 应用配置按钮
        if (els.brollApplyConfig) {
            els.brollApplyConfig.addEventListener('click', async () => {
                if (!state.projectId) {
                    setStatus('请先上传视频并生成字幕', 'error');
                    return;
                }

                const config = getBrollConfig();

                // 验证配置
                if (config.min_shot_duration >= config.max_shot_duration) {
                    setStatus('最小时长必须小于最大时长', 'error');
                    return;
                }

                // 保存配置
                await saveBrollSessionSnapshot(true);

                // 应用配置并重新生成方案
                await runBrollTask(
                    '/api/broll/plan-task',
                    'broll_plan',
                    '正在应用配置并重新分段',
                    '分段方案已更新'
                );
            });
        }

        // 重置配置按钮
        if (els.brollResetConfig) {
            els.brollResetConfig.addEventListener('click', () => {
                applyBrollTemplate('default');
                saveBrollSessionSnapshot(false);  // 自动保存配置
                setStatus('已重置为默认配置', 'success');
            });
        }

        els.generateBtn.addEventListener('click', handleGenerate);
        els.renderVideoBtn.addEventListener('click', renderSubtitleVideo);
        els.brollPlanBtn.addEventListener('click', () => runBrollTask(
            '/api/broll/plan-task',
            'broll_plan',
            '正在生成补画面方案',
            '补画面方案已生成'
        ));
        els.brollSearchBtn.addEventListener('click', async () => {
            await loadBrollProviders();
            runBrollTask('/api/broll/search-task', 'broll_search', '正在搜索补画面素材', '素材候选搜索完成');
        });
        els.brollDownloadBtn.addEventListener('click', () => runBrollTask(
            '/api/broll/download-task',
            'broll_download',
            '正在下载选中素材',
            '选中素材下载完成'
        ));
        els.brollComposeBtn.addEventListener('click', () => runBrollTask(
            '/api/broll/compose-task',
            'broll_compose',
            '正在合成补画面视频',
            '补画面视频合成完成'
        ));
        els.refreshSessionsBtn.addEventListener('click', async () => {
            setStatus('正在刷新字幕项目记录。');
            await loadSessions(false);
            setStatus('字幕项目记录已刷新。', 'success');
        });
        els.sessionList.addEventListener('click', async event => {
            const item = event.target.closest('.history-item');
            if (!item || !item.dataset.projectId) return;
            if (item.dataset.projectId === state.projectId && !els.busyOverlay.hidden) return;
            await restoreSession(item.dataset.projectId);
        });
        els.applyStyleBtn.addEventListener('click', () => {
            readStyle();
            updateActiveSubtitle();
            saveSessionSnapshot(false);
            setStatus('已将样式应用到全部字幕预览和ASS导出。', 'success');
        });
        els.downloadSrtBtn.addEventListener('click', () => {
            setStatus('正在下载SRT字幕文件。', 'success');
            downloadText('auto-subtitle.srt', buildSrt(), 'application/x-subrip;charset=utf-8');
        });
        els.downloadAssBtn.addEventListener('click', () => {
            readStyle();
            setStatus('正在下载ASS字幕文件。', 'success');
            downloadText('auto-subtitle.ass', buildAss(), 'text/plain;charset=utf-8');
        });
        els.downloadVideoLink.addEventListener('click', () => setStatus('正在下载带字幕视频。', 'success'));
        els.openVideoLink.addEventListener('click', () => setStatus('正在打开带字幕视频。', 'success'));
        els.videoPreview.addEventListener('timeupdate', updateActiveSubtitle);
        els.videoPreview.addEventListener('seeked', updateActiveSubtitle);
        els.subtitleList.addEventListener('input', event => {
            const input = event.target.closest('.subtitle-text');
            if (!input || input.dataset.index === undefined) return;
            const index = Number(input.dataset.index);
            if (state.subtitles[index]) {
                state.subtitles[index].text = input.value;
                updateActiveSubtitle();
                saveSessionSnapshot(false);
            }
        });
        els.brollShotList.addEventListener('change', event => {
            if (!state.brollSession || !Array.isArray(state.brollSession.shots)) return;
            const select = event.target.closest('.broll-candidate-select');
            const lock = event.target.closest('.broll-lock');
            const skip = event.target.closest('.broll-skip');
            const target = select || lock || skip;
            if (!target || target.dataset.index === undefined) return;
            const index = Number(target.dataset.index);
            const shot = state.brollSession.shots[index];
            if (!shot) return;
            if (select) {
                shot.selected_candidate_id = select.value || '';
            }
            if (lock) {
                shot.locked = lock.checked;
            }
            if (skip) {
                shot.skipped = skip.checked;
            }
            renderBrollWorkspace();
            saveBrollSessionSnapshot(false);
        });
        [els.brollAspectRatio, els.brollSubtitleMode].forEach(el => {
            el.addEventListener('change', () => {
                state.brollSession = state.brollSession || defaultBrollSession();
                state.brollSession.aspect_ratio = els.brollAspectRatio.value;
                state.brollSession.subtitle_mode = els.brollSubtitleMode.value;
                saveBrollSessionSnapshot(false);
            });
        });
        [els.position, els.fontFamily, els.fontSize, els.fontColor, els.bgColor, els.boldText].forEach(el => {
            el.addEventListener('input', () => {
                readStyle();
                updateActiveSubtitle();
                saveSessionSnapshot(false);
            });
        });

        loadSubtitleStyles().finally(async () => {
            readStyle();
            state.brollSession = defaultBrollSession();
            renderBrollWorkspace();
            await loadBrollProviders();
            // 1. 先在 localStorage 中恢复样式
            const ref = loadSessionRef();
            if (ref && ref.style && typeof ref.style === 'object') {
                state.style = ref.style;
                applyStyleToControls(ref.style);
            }
            await loadSessions(false);
            // 2. 优先恢复上次打开的项目，否则显示最近的项目记录
            const projectId = ref && ref.projectId;
            if (projectId) {
                const ok = await restoreSession(projectId);
                if (!ok) renderSubtitles();
            } else if (state.sessions.length) {
                await restoreSession(state.sessions[0].project_id);
            } else {
                renderSubtitles();
            }
            updateProjectMeta();
        });
    </script>
</body>
</html>
